<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Log in - ComplyPilot</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Poppins:wght@600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../styles.css">
</head>

<body class="landing-page">
<header class="landing-header">
  <div class="landing-container landing-nav">
    <a href="index.html" class="landing-brand logo-brand" aria-label="ComplyPilot home">
      <img src="../assets/complypilot-logo.png" alt="ComplyPilot logo" class="brand-logo-img">
    </a>

    <nav class="landing-links" aria-label="Main navigation">
      <a href="platform.html">Platform</a>
      <a href="assessments.html">Assessments</a>
      <a href="pricing.html">Pricing</a>
      <a href="contact.html">Contact</a>
      <a href="about.html">About us</a>
    </nav>

    <div class="landing-actions">
      <a href="form.html" class="demo-button">Book a demo</a>
      <a href="login.html" class="login-button active-login">Log in</a>
    </div>
  </div>
</header>

<main class="landing-container subpage">
  <section class="login-card">
    <div class="login-copy">
      <div class="compliance-pill">ComplyPilot account</div>
      <h1>Log in to your workspace.</h1>
      <p>Access your ISO 27001 readiness dashboard, evidence tasks, control status, and assessment progress.</p>
    </div>

    <form class="login-form" action="../app/dashboard.html">
      <label>
        Email
        <input type="email" name="email" placeholder="you@company.com">
      </label>

      <label>
        Password
        <input type="password" name="password" placeholder="Enter your password">
      </label>

      <button type="submit">Log in</button>

      <p class="login-helper">
        Don’t have an account yet? <a href="form.html">Book a demo</a>
      </p>
    </form>
  </section>
</main>
</body>
</html>
