<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Settings - ComplyPilot</title>
    <link rel="stylesheet" href="../styles.css">
</head>

<body class="app-body">
<aside class="app-sidebar">
    <a href="dashboard.html" class="app-logo" aria-label="ComplyPilot dashboard">
        <img src="../assets/complypilot-logo-blue.png" alt="ComplyPilot logo">
    </a>

    <nav class="app-nav">
        <a href="dashboard.html" class="app-nav-item"><span>⌘</span>Overview</a>
        <a href="controls.html" class="app-nav-item"><span>☷</span>Controls</a>
        <a href="app-assessments.html" class="app-nav-item"><span>☑</span>Assessments</a>
        <a href="evidence.html" class="app-nav-item"><span>▣</span>Evidence</a>
        <a href="risks.html" class="app-nav-item"><span>♧</span>Risks</a>
        <a href="tasks.html" class="app-nav-item"><span>☰</span>Tasks</a>
        <a href="reports.html" class="app-nav-item"><span>▤</span>Reports</a>
        <a href="settings.html" class="app-nav-item active"><span>⚙</span>Settings</a>
    </nav>

    <div class="app-sidebar-footer">
        <a href="index.html">Back to website</a>
    </div>
</aside>

<main class="app-main settings-page">
    <header class="app-topbar">
        <div>
            <p class="app-eyebrow">ISO 27001 workspace</p>
            <h1>Settings</h1>
            <p>Manage workspace preferences, organization details, and account settings.</p>
        </div>

        <div class="app-topbar-actions">
            <select>
                <option>ISO 27001</option>
            </select>
            <a href="index.html" class="app-logout">Log out</a>
        </div>
    </header>

    <section class="app-page-grid two">
        <article class="app-card settings-form-card">
            <h2>Organization</h2>

            <form class="settings-form">
                <label>
                    Organization name
                    <input type="text" value="ComplyPilot Demo">
                </label>

                <label>
                    Framework
                    <select>
                        <option>ISO 27001</option>
                    </select>
                </label>

                <button type="button">Save changes</button>
            </form>
        </article>

        <article class="app-card settings-form-card">
            <h2>Account</h2>

            <form class="settings-form">
                <label>
                    Name
                    <input type="text" value="Jane Doe">
                </label>

                <label>
                    Email
                    <input type="email" value="jane@company.com">
                </label>

                <button type="button">Update account</button>
            </form>
        </article>
    </section>
</main>
</body>
</html>
